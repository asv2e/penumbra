name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze, test, validate shaders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Validate GLSL
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          bash tools/validate_shaders.sh

  android:
    name: Android (APK, AAB, XAPK)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tools/setup_platforms.sh android
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Package XAPK
        run: bash tools/build.sh android-xapk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-xapk
          path: dist/*.xapk

  ios:
    name: iOS (.app + unsigned IPA)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tools/setup_platforms.sh ios
      - name: Build .app and unsigned IPA
        run: bash tools/build.sh ios-app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: dist/Penumbra-ios-*.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/Penumbra-ios-*-unsigned.ipa

  web:
    name: Web (${{ matrix.target }})
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # web-js:     Dart compiled to JavaScript, no Dart-to-Wasm (CanvasKit renderer).
        # web-skwasm: Dart compiled to WebAssembly, skwasm renderer, JS fallback included.
        target: [web-js, web-skwasm]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tools/setup_platforms.sh web
      - run: bash tools/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}

  linux:
    name: Linux (AppImage + bundle)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: bash tools/setup_platforms.sh linux
      - name: Build bundle and AppImage
        run: bash tools/build.sh linux-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/*.AppImage

  windows:
    name: Windows (MSI + folder)
    needs: analyze
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: bash tools/setup_platforms.sh windows
      - name: Install WiX 5
        run: dotnet tool install --global wix --version "5.*"
      - name: Build release folder and MSI
        run: |
          export PATH="$PATH:$(cygpath -u "$USERPROFILE")/.dotnet/tools"
          bash tools/build.sh windows-msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi

  macos:
    name: macOS (.app + DMG)
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: bash tools/setup_platforms.sh macos
      - name: Build .app and DMG
        run: bash tools/build.sh macos-app macos-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/Penumbra-macos-*.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/Penumbra-*.dmg

  pages:
    name: Deploy web to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tools/setup_platforms.sh web
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, web, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Zip folder artifacts
        run: |
          for d in web-js web-skwasm linux windows; do
            (cd "dist/$d" && zip -qr "../penumbra_$d.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/android-apk/*.apk
            dist/android-aab/*.aab
            dist/android-xapk/*.xapk
            dist/ios-app/*.zip
            dist/ios-ipa/*.ipa
            dist/macos-app/*.zip
            dist/macos-dmg/*.dmg
            dist/linux-appimage/*.AppImage
            dist/windows-msi/*.msi
            dist/penumbra_web-js.zip
            dist/penumbra_web-skwasm.zip
            dist/penumbra_linux.zip
            dist/penumbra_windows.zip
