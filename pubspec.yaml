name: penumbra
description: Non-destructive photo editor with 36 tools, from curves and lens blur to film looks. Opens JPEG, PNG, TIFF and DNG/RAW.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ">=2.2.0 <3.0.0"
  image: ">=4.2.0 <5.0.0"
  archive: ">=3.4.0 <5.0.0"
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  gal: ">=2.3.0 <3.0.0"
  share_plus: ">=10.1.4 <11.0.0"
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_mlkit_face_detection: ">=0.11.0 <1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ">=0.13.1 <1.0.0"

flutter:
  uses-material-design: true
  shaders:
    - shaders/spatial.frag
    - shaders/color.frag
    - shaders/fx.frag
    - shaders/warp.frag
    - shaders/brush.frag

# Launcher icons are configured per platform by tools/setup_platforms.sh, which
# only enables the platforms whose folders exist. Sources: assets/icon/icon.svg
# and icon_foreground.svg; the PNG masters come from tools/make_icons.py.
    image_path: assets/icon/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/icon.png
